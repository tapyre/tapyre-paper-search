version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - /mnt/tapyre-paper-search/mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER} -p${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    restart: always
    mem_limit: 8g
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - /mnt/tapyre-paper-search/qdrant_data:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: ERROR

  api:
    build: .
    container_name: api_service
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      LOG_LEVEL: ERROR
      API_HOST: 0.0.0.0
      API_PORT: 8000
      GUNICORN_WORKERS: 1
      GUNICORN_THREADS: 1
      GUNICORN_TIMEOUT: 120

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      QDRANT_HOST: qdrant
      QDRANT_HTTP_PORT: 6333
      QDRANT_GRPC_PORT: 6334

      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    ports:
      - "8000:8000"
    command: ["bash", "docker/entrypoints/run_api.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    runtime: nvidia
    gpus: all
    shm_size: "4gb"

  pipeline:
    build: .
    container_name: pipeline_service
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      LOG_LEVEL: ERROR
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      QDRANT_HOST: qdrant
      QDRANT_HTTP_PORT: 6333
      QDRANT_GRPC_PORT: 6334

      ARXIV_FIRST_ID: "arXiv:0701.00000"
      ARXIV_LAST_ID: "arXiv:2512.99999"
      ARXIV_RATE_LIMIT: "3.0"
      ARXIV_STATE_FILE: "/app/state/arxiv_state.json"

      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    command: ["bash", "docker/entrypoints/run_pipeline.sh"]
    runtime: nvidia
    gpus: all
    shm_size: "4gb"
    volumes:
      - pipeline_state:/app/state

volumes:
  pipeline_state:
